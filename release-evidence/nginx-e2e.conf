# nginx для ЛОКАЛЬНОЙ проверки production-сборки.
#
# В проде /api проксирует Caddy, а nginx отвечает только за статику. Здесь Caddy
# нет, поэтому тот же proxy_pass добавлен прямо сюда — иначе на локальной
# production-сборке не работал бы ни один запрос к API. Файл живёт вне
# репозитория и в образ не попадает: он монтируется поверх при запуске.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
