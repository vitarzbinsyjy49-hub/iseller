server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: любой неизвестный путь отдаём index.html (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html — точка входа, и внутри неё лежат имена chunk'ов текущей
    # сборки. Директивы кэша здесь не было вовсе: nginx отдавал только ETag и
    # Last-Modified, а браузер по эвристике держал документ в кэше, НЕ спрашивая
    # сервер. Приложение, открытое до деплоя, оставалось на старых именах и на
    # первом же переходе на ещё не загруженный экран получало 404 (в /assets/
    # свой location, SPA-фолбэка там нет) — «Что-то пошло не так» на исправном
    # приложении, лечилось только ручной чисткой кэша.
    #
    # no-cache — это не «не кэшировать», а «кэшировать, но каждый раз
    # перепроверять». ETag остаётся, поэтому неизменённый файл стоит 304-го
    # ответа, а не полной загрузки. Ассеты с хэшем в имени по-прежнему immutable.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # длинный кэш для собранных ассетов с хэшем в имени
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
