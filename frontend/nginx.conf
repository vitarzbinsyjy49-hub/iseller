server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: любой неизвестный путь отдаём index.html (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # длинный кэш для собранных ассетов с хэшем в имени
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
